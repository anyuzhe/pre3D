[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-photogrammetry-workbench"
version = "0.3.0"
description = "Native AI-feature photogrammetry and engineering point-cloud workbench"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
ai-photogrammetry-desktop = "ai_photogrammetry.engineering.desktop:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest>=8.2,<9",
    "ipykernel>=6.29,<6.30",
    "pyinstaller>=6.11,<7",
]
[tool.setuptools.packages.find]
where = ["."]
include = ["ai_photogrammetry*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "E", "W", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
